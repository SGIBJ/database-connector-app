name: On Database Connector Deploy

on:
  repository_dispatch:
    types: [database-connector-deploy]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or SHA to build (for manual triggers)"
        required: true
        default: "main"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CONNECTOR_REF: ${{ github.event.client_payload.ref || inputs.branch }}
      CONNECTOR_SHA: ${{ github.event.client_payload.sha || '' }}
      TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || github.actor }}

    steps:
      - name: Generate App token (private repo, read-only)
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: SGIBJ
          repositories: database-connector
          permission-contents: read

      - name: Checkout database-connector repo
        uses: actions/checkout@v4
        with:
          repository: SGIBJ/database-connector
          token: ${{ steps.app.outputs.token }}
          ref: ${{ env.CONNECTOR_SHA != '' && env.CONNECTOR_SHA || env.CONNECTOR_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js (matches local v24.19.0)
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build info
        id: build-info
        # Publishes BUILD_NUMBER (YYYYMMDD-N) as a step output. The script is
        # idempotent within a run, so the later `pnpm run build` reuses the
        # same number and the tag always matches what is compiled in.
        run: pnpm run build:info:ci

      - name: Build and package the payload
        run: |
          pnpm run build
          pnpm run build:bundle
          # pkg appends .exe to the output path on Windows, so ask it for an
          # extensionless name and rename the result below.
          pnpm dlx @yao-pkg/pkg dist/bundled/index.js --target node24-win-x64 --output release/database-connector
          Move-Item -Force "release\database-connector.exe" "release\database-connector.bin"
          if (-not (Test-Path "release\database-connector.bin")) {
            throw "Payload was not produced; expected release\database-connector.bin"
          }

      - name: Create batch file to run the .bin
        shell: powershell
        run: |
          # The payload is named .bin on purpose: a .exe invites a
          # double-click, and an unsigned exe opened that way triggers the
          # Windows SmartScreen "Windows protected your PC" warning. A .bin
          # is not directly executable from Explorer, so the user runs it
          # through this batch file, which launches it via cmd (CreateProcess)
          # and therefore skips the SmartScreen check.
          #
          # %~dp0 is quoted because it expands to the install path, which can
          # contain spaces. The file is written as ASCII without a BOM: cmd.exe
          # chokes on a UTF-8 BOM at the start of a batch file.
          $batContent = "@echo off`r`n"
          $batContent += "cd /d `"%~dp0`"`r`n"
          $batContent += "`"database-connector.bin`"`r`n"
          $batContent += "pause`r`n"
          [System.IO.File]::WriteAllText("run.bat", $batContent, [System.Text.Encoding]::ASCII)

      - name: Create release artifacts zip
        shell: powershell
        run: |
          $releaseName = "database-connector-${{ steps.build-info.outputs.BUILD_NUMBER }}-${{ github.sha }}-windows"
          $zipPath = "${releaseName}.zip"

          Compress-Archive -Path "release\*.bin", "run.bat" -DestinationPath $zipPath -Force

          echo "RELEASE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag suffix MUST equal the build number compiled into the payload,
          # because the updater compares the embedded number against the
          # version at the end of the latest release tag.
          tag_name: database-connector-deploy-${{ steps.build-info.outputs.BUILD_NUMBER }}
          name: Database Connector - Windows Release ${{ steps.build-info.outputs.BUILD_NUMBER }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ZIP }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
